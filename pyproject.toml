[project]
name = "hackinsight"
version = "1.0.0"
description = "Pakistan district malaria & dengue early-warning: data pipeline, quality agent, forecast model and cited insight agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32",
    "pdfplumber>=0.11",
    "rapidocr-onnxruntime>=1.3",   # OCR for scanned NIH advisories (pip only, no system install)
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "pandera>=0.20",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "prefect>=3.0",
    "sqlalchemy>=2.0,<2.1",   # Prefect 3.8 scheduler breaks on SQLAlchemy 2.1 bulk DML
    "gradio>=5.0",
    "plotly>=5.20",
    "huggingface_hub>=0.25",
    "anthropic>=0.40",
    "psutil>=6.0",
    "reportlab>=4.2",
    "pytest>=8.0",
]

[project.scripts]
hi = "hackinsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackinsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
